services:

  lorawan-sniffer:
    image: lorawan-sniffer:latest
    container_name: lorawan-sniffer
    restart: unless-stopped

    ports:

      # WebUI and HTTP API
      - "8888:8888"

      # LoRaWAN gateway UDP port (Semtech Packet Forwarder)
      - "1700:1700/udp"

    environment:
      GATEWAY_PROTOCOL: "udp"
      GATEWAY_UDP_UPSTREAM_SERVER: "your-lns-host"
      GATEWAY_UDP_UPSTREAM_PORT: "1700"

    volumes:

      # Persistent SQLite database.
      - sniffer-data:/var/lib/lorawan-sniffer


  udp-packet-forwarder:

    image: rakwireless/udp-packet-forwarder:latest
    container_name: udp-packet-forwarder
    restart: unless-stopped
    devices:
      - /dev/ttyACM0
    environment:
      MODEL: "RAK5146"
      INTERFACE: "USB"
      GATEWAY_EUI: "0016xxxxxxd7e5"
      SERVER_HOST: lorawan-sniffer

volumes:
  sniffer-data:
