services:

  lorawan-sniffer:
    image: lorawan-sniffer:latest
    depends_on:
      chirpstack-concentratord:
        condition: service_healthy
    ports:
      # WebUI and HTTP API
      - "8888:8888"
      # LoRaWAN gateway UDP port (Semtech Packet Forwarder)
      - "1700:1700/udp"
    volumes:
      # Mount your configuration file (see sniffer.toml for an example).
      - ./sniffer.toml:/etc/lorawan-sniffer/sniffer.toml:ro
      # Persistent SQLite database.
      - sniffer-data:/var/lib/lorawan-sniffer
      - /tmp:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/tmp/sniffer_command"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # For Concentratord IPC mode, the sniffer must share the host IPC namespace
  # (or a shared tmpfs volume) with concentratord so ZMQ IPC sockets are
  # accessible by both processes.  Uncomment the lines below and set
  # protocol = "concentratord" in sniffer.toml.
  #
  # network_mode: host          # allows IPC socket access on host /tmp
  #   # or mount a shared tmpfs:
  # volumes:
  #    - ipc-sockets:/tmp
  # See https://github.com/xoseperez/chirpstack-concentratord-docker
  
  chirpstack-concentratord:

    container_name: chirpstack-concentratord
    image: xoseperez/chirpstack-concentratord
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/tmp/concentratord_command"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - /tmp:/tmp
    devices:
      - /dev/rak5146:/dev/ttyACM0
    group_add:
      - dialout
    environment:
      - MODEL=RAK5146
      - INTERFACE=USB
  
  chirpstack-mqtt-forwarder:

    container_name: chirpstack-mqtt-forwarder
    image: xoseperez/chirpstack-mqtt-forwarder
    depends_on:
      lorawan-sniffer:
        condition: service_started
    restart: unless-stopped

    volumes:
      - /tmp:/tmp
    
    secrets:
      - ca.pem
      - cert.pem
      - key.pem
    
    environment:
      LOGGING_LEVEL: "INFO"
      MQTT_SERVER: "ssl://lns.example.com:8883"
      MQTT_CA_CERT_PATH: "/run/secrets/ca.pem"
      MQTT_CLIENT_CERT_PATH: "/run/secrets/cert.pem"
      MQTT_CLIENT_KEY_PATH: "/run/secrets/key.pem"
      BACKEND: "concentratord"
      BACKEND_SOCKET_NAME: "sniffer"

secrets:
  ca.pem:
    file: .certs/tc.trust
  cert.pem:
    file: .certs/tc.cert
  key.pem:
    file: .certs/tc.key 


volumes:
  sniffer-data:
  # ipc-sockets:
  #   driver: local
  #   driver_opts:
  #     type: tmpfs
  #     device: tmpfs
