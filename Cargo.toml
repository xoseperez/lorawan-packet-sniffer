[workspace]
  resolver = "3"
  members = [
    "lorawan-sniffer",
  ]

[workspace.dependencies]
  serde = { version = "1.0", features = ["derive"] }
  serde_json = "1.0"
  toml = { version = "0.9", default-features = false, features = [
    "std",
    "parse",
    "serde",
  ] }
  clap = { version = "4.5", default-features = false, features = [
    "std",
    "help",
    "usage",
    "derive",
  ] }
  log = "0.4"
  simple_logger = { version = "5", default-features = false, features = [
    "timestamps",
  ] }
  chrono = { version = "0.4", default-features = false, features = [
    "now",
    "serde",
  ] }
  humantime-serde = "1.1"
  syslog = "7.0"
  handlebars = "6.4"
  anyhow = "1.0"
  thiserror = "2.0"
  tokio = { version = "1", features = ["full"] }
  tokio-util = { version = "0.7", features = ["rt"] }
  uuid = { version = "1.0", features = ["v4"] }
  base64 = "0.22"
  rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
  prost = "0.13"
  zmq = "0.10"
  axum = { version = "0.7", features = ["ws"] }
  tower-http = { version = "0.5", features = ["cors"] }
  http-body = "1"
  rust-embed = "8"
  mime_guess = "2.0"
  # Media-type parsing for the login endpoints' Content-Type check; already in
  # the tree through axum.
  mime = "0.3"
  # HMAC and the system random source for the WebUI login; already compiled
  # into every build through rustls, so it adds no crate.
  ring = "0.17"
  # MQTT client without its default TLS provider: the default pulls in aws-lc-rs,
  # which needs CMake/NASM to cross-compile to musl. TLS uses rustls with ring instead.
  rumqttc = { version = "0.25", default-features = false, features = [
    "use-rustls-no-provider",
  ] }
  rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
  ] }
  rustls-pki-types = { version = "1", features = ["std"] }
  webpki-roots = "1"

  # Test-only
  bytes = "1"
  tower = { version = "0.5", features = ["util"] }
  http-body-util = "0.1"
