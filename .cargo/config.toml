# Flags for cross-compiled musl targets (used inside cross Docker containers):
# a fully static binary. Stripping is set in the release profile (Cargo.toml).
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
