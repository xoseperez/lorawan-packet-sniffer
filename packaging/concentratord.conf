# Override for running lorawan-sniffer.service in Concentratord mode.
#
# Concentratord and the forwarder behind the sniffer talk to it through
# ZeroMQ sockets in /tmp. The default service gives the sniffer a private
# /tmp (so it would never see those sockets) and a throwaway user (which could
# not open sockets created by root). This override shares the real /tmp and
# runs the sniffer as root; set User= to the account Concentratord runs as if
# that is not root.
#
# Install:
#   mkdir -p /etc/systemd/system/lorawan-sniffer.service.d
#   cp concentratord.conf /etc/systemd/system/lorawan-sniffer.service.d/
#   systemctl daemon-reload && systemctl restart lorawan-sniffer
#
# and set protocol = "concentratord" in /etc/lorawan-sniffer/sniffer.toml.

[Service]
DynamicUser=no
User=root
PrivateTmp=no
ReadWritePaths=/tmp
# The service's system call filter would kill the sniffer (SIGSYS) on two
# calls this mode makes: ZeroMQ sets its I/O threads' scheduling policy when
# it starts, and SQLite, when running as root, hands its journal files to the
# database file's owner.
SystemCallFilter=fchown sched_setscheduler
